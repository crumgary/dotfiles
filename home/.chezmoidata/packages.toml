# HyperFrames requires libx264 for its default MP4 render. The distro's
# ffmpeg-free build lacks that encoder; use the signed RPM Fusion free build.
[managed.almalinux.repositories.rpmfusion-free]
uri = "https://download1.rpmfusion.org/free/el/updates/9/x86_64/"
key_url = "https://download1.rpmfusion.org/free/el/RPM-GPG-KEY-rpmfusion-free-el-9"
key_sha256 = "ec2c037f6014641cd12195121d97a871cadf385186a20ec3a7757dcd84907031"

