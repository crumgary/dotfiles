# Single source of truth for package names.
# The run_onchange_install-packages.sh.tmpl script reads this and installs the relevant set per profile + OS.

[apt]
# Ubuntu/Debian package names.
# fd-find, bat, zoxide, fzf, keychain — moved to [release_binary] so they install without sudo
# on machines where the user doesn't have it.
# eza, delta, starship — release-binary too (versions in repos are too old).
common = [
  "build-essential",
  "ca-certificates",
  "curl",
  "gh",
  "git",
  "git-lfs",
  "gnupg",
  "jq",
  "less",
  "python3-pip",
  "ripgrep",
  "tmux",
  "tree",
  "unzip",
  "wget",
  "shellcheck",
  "vim",
]
wsl = ["wslu"]
devbox = []
lab = []
embedded = []

# Verified package-manager path for Ubuntu 26.04. Older releases retain the
# release-binary fallback below when these versions are unavailable.
ubuntu_26_04 = [
  "eza", "bat", "fd-find", "zoxide", "fzf", "keychain", "glow",
  "git-delta", "starship", "fontconfig", "locales",
]

[dnf]
# RHEL/AlmaLinux/Fedora package names. Same release-binary fallback policy as apt.
common = [
  "@development-tools",
  "ca-certificates",
  "curl",
  "gh",
  "git",
  "git-lfs",
  "gnupg2",
  "jq",
  "less",
  "python3-pip",
  "ripgrep",
  "tmux",
  "tree",
  "unzip",
  "wget",
  "ShellCheck",
  "vim-enhanced",
]
wsl = []
devbox = []
lab = []
embedded = []

[release_binary]
# Fallback versions for tools not provided by the verified distro package path.
# Ubuntu 26.04 uses signed apt packages; older systems retain sudo-free downloads.
eza      = "0.18.21"
delta    = "0.18.2"
fd       = "10.2.0"
bat      = "0.24.0"
zoxide   = "0.9.6"
fzf      = "0.56.3"
glow     = "2.0.0"
keychain = "2.9.4"

[fonts]
nerd_font           = "JetBrainsMono"
nerd_font_version   = "3.2.1"

# Command requirements for the read-only doctor. These complement package names
# above: command aliases vary by distro, and presence never proves a version.
[doctor]
common = [
  "bash", "git", "curl", "gh", "rg", "jq", "tmux", "starship", "vim",
  "eza", "delta", "fd|fdfind", "bat|batcat", "zoxide", "fzf", "glow", "keychain",
]
embedded = ["sh", "vi"]

[doctor.bundles]
coding = ["claude", "agy", "opencode", "codex", "herdr", "node", "npm"]

developer = ["node", "npm", "gh", "gh-axi", "rtk", "acli", "actionlint", "skopeo", "asciinema", "playwright", "uv", "graphify", "graphify-mcp", "ctx7", "skills", "hyperframes", "chrome-devtools-axi", "axi-chrome", "jira-axi", "confluence-axi", "ffmpeg", "magick", "pandoc", "pdftotext", "rsvg-convert"]
