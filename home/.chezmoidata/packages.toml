[managed.almalinux.packages.skopeo]
name = "skopeo"
commands = ["skopeo"]

[managed.almalinux.packages.asciinema]
name = "asciinema"
commands = ["asciinema"]

[managed.almalinux.packages.nodejs]
repository = "nodesource"
name = "nodejs"
commands = ["node", "npm"]

[managed.almalinux.packages.ffmpeg]
repository = "rpmfusion-free"
name = "ffmpeg"
commands = ["ffmpeg"]

[managed.almalinux.packages.imagemagick]
name = "ImageMagick"
commands = ["magick|convert"]

[managed.almalinux.packages.pandoc]
name = "pandoc"
