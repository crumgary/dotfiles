key_sha256 = "84925b05177ef717c71f2d7d72008114ed3837586949f3aab027b687bfd729c0"
repo_gpgcheck = true

[managed.almalinux.repositories.nodesource]
uri = "https://rpm.nodesource.com/pub_{node_major}.x/nodistro/nodejs/x86_64"
key_url = "https://rpm.nodesource.com/gpgkey/ns-operations-public.key"
key_sha256 = "cfb2b38ceed5893e02d77a9fb3755f70eeea40e5740505fd02307f0814bc3519"
